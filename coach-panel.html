<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movement Mind — Coach Panel</title><style>body{font-family:Arial,sans-serif;margin:0;background:#eee9df;color:#171714}.app{max-width:1000px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;border-bottom:1px solid #171714;padding-bottom:14px}.logo{font-weight:800;letter-spacing:.15em}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.card{background:#f8f5ee;border:1px solid #d2c9ba;border-radius:14px;padding:14px}.stat b{font-size:26px;display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button,input,select{font:inherit}.btn{border:0;border-radius:10px;background:#151512;color:white;padding:10px 13px;font-weight:700}.ghost,.search{border:1px solid #d2c9ba;border-radius:10px;background:#f8f5ee;padding:10px 12px}.search{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:10px}.student{display:grid;grid-template-columns:1.3fr .8fr .8fr auto;gap:8px;padding:11px;border-bottom:1px solid #d2c9ba;cursor:pointer}.muted{color:#746f66;font-size:12px}.progress{height:8px;background:#ded7cb;border-radius:99px;overflow:hidden}.progress div{height:100%;background:#171714}.modal{display:none;position:fixed;inset:0;background:#0007;padding:20px}.modal.on{display:block}.sheet{max-width:620px;margin:40px auto;background:#f8f5ee;border-radius:16px;padding:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:11px;color:#746f66;display:block}.form input,.form select,.form textarea{width:100%;box-sizing:border-box;padding:9px;border:0;border-bottom:1px solid #d2c9ba;background:transparent}.wide{grid-column:1/-1}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid,.form{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="app"><div class="top"><div class="logo">MOVEMENT MIND</div><div class="muted">COACH PANEL 1.0</div></div><h1>Öğrenci Yönetimi</h1><div class="stats"><div class="card stat"><span class="muted">Aktif</span><b id="active">0</b></div><div class="card stat"><span class="muted">Yakında biten</span><b id="ending">0</b></div><div class="card stat"><span class="muted">Kalan ders</span><b id="remaining">0</b></div><div class="card stat"><span class="muted">Yenileme</span><b id="renew">0</b></div></div><div class="toolbar"><button class="btn" id="add">+ Öğrenci</button><input class="search" id="search" placeholder="Ara"><select class="ghost" id="filter"><option value="all">Tümü</option><option value="active">Aktif</option><option value="ending">Yakında biten</option><option value="ended">Biten</option></select></div><div class="grid"><section class="card" id="list"></section><aside class="card" id="detail"><span class="muted">Bir öğrenci seç.</span></aside></div><p class="muted">Bu sürüm verileri yalnızca bu tarayıcıda saklar. Bulut senkronizasyonu yoktur.</p></main><div class="modal" id="modal"><div class="sheet"><h2 id="title">Öğrenci ekle</h2><form id="form" class="form"><input type="hidden" id="id"><div><label>Ad soyad</label><input id="name" required></div><div><label>Durum</label><select id="status"><option value="active">Aktif</option><option value="paused">Donduruldu</option><option value="ended">Bitti</option></select></div><div><label>Başlangıç</label><input type="date" id="start" required></div><div><label>Bitiş</label><input type="date" id="end" required></div><div><label>Paket ders</label><input type="number" id="pack" min="1" value="8"></div><div><label>Kullanılan ders</label><input type="number" id="used" min="0" value="0"></div><div><label>Hedef</label><input id="goal" placeholder="Hipertrofi, HYROX..."></div><div><label>Haftalık sıklık</label><input type="number" id="freq" min="1" max="7" value="2"></div><div class="wide"><label>Not</label><textarea id="notes"></textarea></div><div class="wide"><button class="btn" type="submit">Kaydet</button> <button class="ghost" type="button" id="cancel">İptal</button></div></form></div></div><script>const $=x=>document.getElementById(x),K='mm_students_v1';let data=JSON.parse(localStorage.getItem(K)||'[]'),selected=null;const today=()=>new Date().toISOString().slice(0,10);function rem(s){return Math.max(0,(+s.pack||0)-(+s.used||0))}function left(s){return Math.ceil((new Date(s.end+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)}function state(s){if(s.status==='ended'||left(s)<0)return'ended';if(left(s)<=14)return'ending';return'active'}function save(){localStorage.setItem(K,JSON.stringify(data));render()}function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;let rows=data.filter(s=>(s.name+' '+s.goal).toLowerCase().includes(q));if(f!=='all')rows=rows.filter(s=>state(s)===f);$('active').textContent=data.filter(s=>state(s)!=='ended'&&s.status!=='paused').length;$('ending').textContent=data.filter(s=>state(s)==='ending').length;$('remaining').textContent=data.reduce((a,s)=>a+(state(s)==='ended'?0:rem(s)),0);$('renew').textContent=data.filter(s=>state(s)!=='ended'&&rem(s)<=2).length;$('list').innerHTML=rows.length?rows.map(s=>`<div class="student" data-id="${s.id}"><div><b>${s.name}</b><div class="muted">${s.goal||'—'}</div></div><div><span class="muted">Bitiş</span><br>${s.end}</div><div><span class="muted">Kalan</span><br>${rem(s)} ders</div><div>›</div></div>`).join(''):'<span class="muted">Kayıt yok.</span>';document.querySelectorAll('.student').forEach(e=>e.onclick=()=>{selected=e.dataset.id;detail()});detail()}function detail(){let s=data.find(x=>x.id===selected);if(!s){$('detail').innerHTML='<span class="muted">Bir öğrenci seç.</span>';return}let pct=Math.min(100,Math.round((+s.used/(+s.pack||1))*100));$('detail').innerHTML=`<h2>${s.name}</h2><div class="muted">${s.goal||'—'} · haftada ${s.freq} gün</div><div class="progress"><div style="width:${pct}%"></div></div><p>${s.used}/${s.pack} ders · ${rem(s)} kaldı</p><p><b>Başlangıç:</b> ${s.start}<br><b>Bitiş:</b> ${s.end}<br><b>Not:</b> ${s.notes||'—'}</p><button class="btn" id="use">+1 ders</button> <button class="ghost" id="edit">Düzenle</button>`;$('use').onclick=()=>{if(+s.used<+s.pack){s.used++;save()}};$('edit').onclick=()=>open(s)}function open(s){$('id').value=s?.id||'';$('name').value=s?.name||'';$('status').value=s?.status||'active';$('start').value=s?.start||today();let d=new Date();d.setMonth(d.getMonth()+1);$('end').value=s?.end||d.toISOString().slice(0,10);$('pack').value=s?.pack||8;$('used').value=s?.used||0;$('goal').value=s?.goal||'';$('freq').value=s?.freq||2;$('notes').value=s?.notes||'';$('modal').classList.add('on')}$('add').onclick=()=>open();$('cancel').onclick=()=>$('modal').classList.remove('on');$('form').onsubmit=e=>{e.preventDefault();let o={id:$('id').value||String(Date.now()),name:$('name').value.trim(),status:$('status').value,start:$('start').value,end:$('end').value,pack:+$('pack').value,used:+$('used').value,goal:$('goal').value.trim(),freq:+$('freq').value,notes:$('notes').value.trim()};let i=data.findIndex(x=>x.id===o.id);if(i>=0)data[i]=o;else data.push(o);selected=o.id;$('modal').classList.remove('on');save()};$('search').oninput=render;$('filter').onchange=render;render();</script></body></html>
